name: Validate Relink
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        emdash: ["0.38.0", "0.39.0", "0.40.0", "0.41.0", "0.42.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: matrix.emdash == '0.42.0'
      - run: node scripts/set-compatibility-version.mjs ${{ matrix.emdash }} && pnpm install --no-frozen-lockfile
        if: matrix.emdash != '0.42.0'
      - run: pnpm check
      - run: pnpm test:package
        if: matrix.emdash == '0.42.0'
      - run: node scripts/seed-browser.mjs
        if: matrix.emdash == '0.42.0'
      - run: pnpm exec playwright install --with-deps chromium
        if: matrix.emdash == '0.42.0'
      - run: pnpm test:browser
        if: matrix.emdash == '0.42.0'
      - run: pnpm --filter relink-example-cloudflare build
        if: matrix.emdash == '0.42.0'
      - uses: actions/upload-artifact@v4
        if: matrix.emdash == '0.42.0'
        with:
          name: emdash-plugin-relink
          path: work/artifacts/*.tgz
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics-${{ matrix.emdash }}
          path: |
            playwright-report/
            test-results/
